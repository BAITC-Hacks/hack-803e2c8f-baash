name: pulse109

services:
  postgres:
    # postgis/postgis publishes amd64 only, so an arm64 host (Apple Silicon)
    # cannot build this image natively. Pinning the platform makes the service
    # run under emulation there and changes nothing on amd64 CI runners.
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: infra/compose/postgres.Dockerfile
    image: pulse109-postgres:16-postgis-3.5-pgvector-0.8.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse109}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse109-local}
      POSTGRES_USER: ${POSTGRES_USER:-pulse109}
    ports:
      - "5432:5432"
    healthcheck:
      # The check has to go over TCP. During initdb the image runs a temporary
      # server on the unix socket only, so a socket check reports healthy while
      # the real server is still starting, and migrate then races it and dies.
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-pulse109} -d ${POSTGRES_DB:-pulse109}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - pulse109-postgres:/var/lib/postgresql/data

  minio:
    profiles: [object-storage]
    image: quay.io/minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pulse109-local-secret}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pulse109-local}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pulse109-minio:/data

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command: ["alembic", "-c", "services/core/alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://pulse109:${POSTGRES_PASSWORD:-pulse109-local}@postgres:5432/pulse109
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core-api:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command:
      ["uvicorn", "pulse109.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      PULSE109_DATABASE_URL: postgresql+psycopg://pulse109:${POSTGRES_PASSWORD:-pulse109-local}@postgres:5432/pulse109
      PULSE109_ENVIRONMENT: local
      PULSE109_MANUAL_REPOSITORY_MODE: postgres
      PULSE109_READINESS_DATABASE_REQUIRED: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command:
      [
        "uvicorn",
        "pulse109_worker.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8081",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PULSE109_DATABASE_URL: postgresql+psycopg://pulse109:${POSTGRES_PASSWORD:-pulse109-local}@postgres:5432/pulse109
      PULSE109_WORKER_ENABLED: "true"
      PULSE109_WORKER_ADAPTER_MODE: replay
    ports:
      - "8081:8081"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  inference:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command:
      [
        "uvicorn",
        "pulse109_inference.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8082",
      ]
    ports:
      - "8082:8082"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  adapter-runtime:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command:
      [
        "uvicorn",
        "pulse109_replay.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8083",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8083/v1/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  open311-sandbox:
    build:
      context: ../..
      dockerfile: infra/docker/python-process.Dockerfile
    command:
      [
        "uvicorn",
        "pulse109_open311.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8084",
      ]
    ports:
      - "8084:8084"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8084/v1/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_URL: http://core-api:8080
    depends_on:
      core-api:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pulse109-minio:
  pulse109-postgres:
