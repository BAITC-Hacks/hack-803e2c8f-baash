name: pulse109-ci

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          cache: pnpm
      - name: Bootstrap locked dependencies
        run: |
          uv sync --all-groups --frozen
          pnpm install --frozen-lockfile
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Contract test
        run: make contract-test
      - name: E2E smoke
        run: make e2e
      - name: Build
        run: make build
      - name: Validate Compose model
        run: docker compose -f infra/compose/docker-compose.yml config --quiet

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - name: Bootstrap locked Python dependencies
        run: uv sync --all-groups --frozen
      - name: Start local topology and wait for health
        run: docker compose -f infra/compose/docker-compose.yml up --build --wait --wait-timeout 300
      - name: Verify service endpoints
        run: |
          curl --fail http://127.0.0.1:8080/v1/health/ready
          curl --fail http://127.0.0.1:8081/v1/health/ready
          curl --fail http://127.0.0.1:8082/v1/health/ready
          curl --fail http://127.0.0.1:8083/v1/health/ready
          curl --fail http://127.0.0.1:8084/v1/health/live
          curl --fail http://127.0.0.1:3000/api/health
      - name: Verify extensions and migration head
        run: |
          test "$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U pulse109 -d pulse109 -Atc \
            "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname IN ('postgis','vector');")" = "postgis,vector"
            test "$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
              psql -U pulse109 -d pulse109 -Atc "SELECT version_num FROM alembic_version;")" = "0017_m11_replay_lab"
      - name: Verify PostgreSQL-backed import
        env:
          PULSE109_TEST_DATABASE_URL: postgresql://pulse109:pulse109-local@127.0.0.1:5432/pulse109
        run: uv run pytest tests/integration -q
      - name: Restore into a disposable database and compare durable state
        run: |
          compose=(docker compose -f infra/compose/docker-compose.yml)
          "${compose[@]}" exec -T postgres pg_dump -U pulse109 -d pulse109 \
            --format=custom --no-owner --file=/tmp/pulse109-restore-drill.dump
          "${compose[@]}" exec -T postgres createdb -U pulse109 pulse109_restore
          "${compose[@]}" exec -T postgres pg_restore -U pulse109 -d pulse109_restore \
            --exit-on-error --no-owner --no-privileges /tmp/pulse109-restore-drill.dump
          for table in integration.source_record appeals.appeal appeals.appeal_event audit.audit_event integration.outbox; do
            source_count=$("${compose[@]}" exec -T postgres psql -U pulse109 -d pulse109 -Atc "SELECT count(*) FROM $table")
            restored_count=$("${compose[@]}" exec -T postgres psql -U pulse109 -d pulse109_restore -Atc "SELECT count(*) FROM $table")
            test "$source_count" = "$restored_count"
          done
          source_hash=$("${compose[@]}" exec -T postgres psql -U pulse109 -d pulse109 -Atc \
            "SELECT md5(coalesce(string_agg(raw_payload_hash::text, '' ORDER BY id), '')) FROM integration.source_record")
          restored_hash=$("${compose[@]}" exec -T postgres psql -U pulse109 -d pulse109_restore -Atc \
            "SELECT md5(coalesce(string_agg(raw_payload_hash::text, '' ORDER BY id), '')) FROM integration.source_record")
          test "$source_hash" = "$restored_hash"
          test "$("${compose[@]}" exec -T postgres psql -U pulse109 -d pulse109_restore -Atc \
              'SELECT version_num FROM alembic_version')" = "0017_m11_replay_lab"
      - name: Capture container logs
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml logs --no-color
      - name: Stop local topology
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --volumes

  security-supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          cache: pnpm
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file requirements-audit.txt
          uvx pip-audit==2.9.0 -r requirements-audit.txt
      - name: Audit locked Node dependencies
        run: pnpm audit --audit-level high
      - name: Scan repository secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact .
      - name: Build API image
        id: build_image
        run: docker build -f infra/docker/python-process.Dockerfile -t pulse109-api:scan .
      - name: Scan image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse109-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Fail on remediable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse109-api:scan
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate CycloneDX SBOM
        if: always() && steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pulse109-api:scan
          format: cyclonedx
          output: pulse109-api.cdx.json
          scan-type: image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-and-sbom
          path: |
            trivy-results.sarif
            pulse109-api.cdx.json
