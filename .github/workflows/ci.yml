name: pulse109-ci

on:
  pull_request:
  push:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.14.0"
          cache: pnpm
      - name: Bootstrap locked dependencies
        run: |
          uv sync --all-groups --frozen
          pnpm install --frozen-lockfile
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test
        run: make test
      - name: Contract test
        run: make contract-test
      - name: E2E smoke
        run: make e2e
      - name: Build
        run: make build
      - name: Validate Compose model
        run: docker compose -f infra/compose/docker-compose.yml config --quiet

  container-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Start local topology and wait for health
        run: docker compose -f infra/compose/docker-compose.yml up --build --wait --wait-timeout 300
      - name: Verify service endpoints
        run: |
          curl --fail http://127.0.0.1:8080/v1/health/ready
          curl --fail http://127.0.0.1:8081/v1/health/ready
          curl --fail http://127.0.0.1:8082/v1/health/ready
          curl --fail http://127.0.0.1:8083/v1/health/ready
          curl --fail http://127.0.0.1:3000/api/health
      - name: Verify extensions and migration head
        run: |
          test "$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U pulse109 -d pulse109 -Atc \
            "SELECT string_agg(extname, ',' ORDER BY extname) FROM pg_extension WHERE extname IN ('postgis','vector');")" = "postgis,vector"
          test "$(docker compose -f infra/compose/docker-compose.yml exec -T postgres \
            psql -U pulse109 -d pulse109 -Atc "SELECT version_num FROM alembic_version;")" = "0004_m3_routing_assistance"
      - name: Capture container logs
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml logs --no-color
      - name: Stop local topology
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down --volumes
