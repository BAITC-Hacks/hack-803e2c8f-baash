        job_id:
          type: string
          format: uuid
        type:
          type: string
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        result_ref:
          type: [string, 'null']
        error_code:
          type: [string, 'null']
    SyncReceipt:
      type: object
      required: [outbox_event_id, status]
