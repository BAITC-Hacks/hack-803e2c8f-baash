        source_system:
          type: string
        last_attempt_at:
          type: [string, 'null']
          format: date-time
        external_id:
          type: [string, 'null']
    ServiceDefinition:
      type: object
      required: [service_id, region_id, version, effective_from, display_name, active]
      properties:
        service_id:
          type: string
        region_id:
          type: string
        version:
          type: string
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: [string, 'null']
          format: date-time
        display_name:
          type: object
          required: [kk, ru]
          properties:
            kk:
