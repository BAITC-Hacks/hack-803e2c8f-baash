      properties:
        policy_type:
          type: string
          enum: [routing, sla, confidence]
        region_id:
          type: string
        version:
          type: string
        state:
          type: string
          enum: [draft, pending_approval, approved, retired]
        effective_from:
          type: [string, 'null']
          format: date-time
        effective_to:
          type: [string, 'null']
          format: date-time
        parameters:
