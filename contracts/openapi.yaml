          additionalProperties: true
        approval_ref:
          type: [string, 'null']
        rollback_version:
          type: [string, 'null']
        synthetic_only:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, trace_id]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        trace_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
